<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>カタヅケ LINE 用アートボード（背景画像・リッチメニュー）</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&family=Noto+Sans+JP:wght@400;500&family=Montserrat:wght@600&display=swap" rel="stylesheet">
<style>
:root{--primary:#1447e0;--ink:#20242e;--body:#454e59;--line:#dce3ea;--pale:#eef3ff;
 --head:"Noto Serif JP",serif;--ui:"Noto Sans JP",sans-serif;--en:"Montserrat",sans-serif}
body{margin:0;background:#888;font-family:var(--head);color:var(--ink);-webkit-font-smoothing:auto}
.board{background:#fff;margin:20px;position:relative;overflow:hidden}
/* ---- 背景画像（プロフィールページ上部）1080×878 ---- */
/* LINE の背景画像はトリミング枠が約2:1 のため 1080×540 で作る（横組みロックアップ＋短いタグライン） */
#cover{width:1080px;height:540px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
#cover .lock{display:flex;align-items:center;gap:44px}
#cover .col{display:flex;flex-direction:column}
#cover .ja{font-size:92px;letter-spacing:.14em;line-height:1}
#cover .en{font-family:var(--en);font-weight:600;font-size:34px;letter-spacing:.18em;color:var(--primary);margin-top:18px}
#cover .tag{font-size:26px;letter-spacing:.08em;color:var(--body);margin-top:54px}
#cover img{width:190px}
/* ---- リッチメニュー 大 2500×1686（3列×2行） ---- */
#rich{width:2500px;height:1686px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);background:var(--line);gap:4px;padding:4px;box-sizing:border-box}
#rich .cell{background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;position:relative}
#rich .cell.key{background:var(--primary);color:#fff}
#rich .cell.key .sub{color:rgba(255,255,255,.8)}
#rich .cell.key svg{stroke:#fff}
#rich .label{font-family:var(--head);font-weight:600;font-size:74px;letter-spacing:.1em;line-height:1}
#rich .sub{font-family:var(--ui);font-weight:400;font-size:34px;letter-spacing:.06em;color:var(--body);line-height:1}
#rich svg{width:150px;height:150px;fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:butt;stroke-linejoin:miter}
#rich .cell.key .label{color:#fff}
</style></head><body>

<div class="board" id="cover">
  <div class="lock"><img src="svg/icon_A_ink_blue.svg" alt=""><div class="col"><div class="ja">カタヅケ</div><div class="en">KATAZUKE</div></div></div>
  <div class="tag">家まるごと、まとめて片付け買取。撮るだけ・待つだけ。</div>
</div>

<div class="board" id="rich">
  <div class="cell key">
    <svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
    <div class="label">撮って依頼する</div><div class="sub">不用品を撮るだけ・無料</div>
  </div>
  <div class="cell">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
    <div class="label">マイページ</div><div class="sub">依頼状況・入札・訪問予定</div>
  </div>
  <div class="cell">
    <svg viewBox="0 0 24 24"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg>
    <div class="label">使い方</div><div class="sub">4ステップで完了</div>
  </div>
  <div class="cell">
    <svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg>
    <div class="label">よくある質問</div><div class="sub">費用・対応エリア・当日の流れ</div>
  </div>
  <div class="cell">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16"/><path d="M3 15l5-5 4 4 3-3 6 6"/><circle cx="16" cy="8.5" r="1.5"/></svg>
    <div class="label">撮影ガイド</div><div class="sub">高く売れる撮り方</div>
  </div>
  <div class="cell">
    <svg viewBox="0 0 24 24"><path d="M3 5h18v14H3z"/><path d="M3 5l9 8 9-8"/></svg>
    <div class="label">お問い合わせ</div><div class="sub">運営事務局へ</div>
  </div>
</div>
</body></html>
