name: CI

# push (main) / pull_request 時に自動実行する統合チェック。
# - backend: pytest（SQLite・秘密情報不要）
# - web: tsc --noEmit → eslint（警告は許容・エラーのみ失敗）→ next build
#   next build に必要な環境変数はダミー値を使用（本番の秘密情報は使わない）。
# 直近、tsc/eslint は通るのに next build だけ落ちる不備（useSearchParams の
# Suspense 欠落）が本番直前に発覚したため、push/PR ゲートとして next build まで通す。

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read   # notify が直前の実行結果（失敗→復旧）を照合するため

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run pytest
        run: pytest -q

  # 実 PostgreSQL 16 での同時実行チェック（行ロック・部分一意索引・冪等キー）。
  # SQLite の pytest では SELECT ... FOR UPDATE が no-op のため実証できない領域を、
  # ローカルの Docker に頼らず push ごとに検証する（自動運用 r13）。
  # 手順とシナリオの正本は docs/ops/e2e.md「PG 同時実行チェックの手順」。
  pg-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: kdz
          POSTGRES_DB: kdz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:kdz@127.0.0.1:5432/kdz
      KDZ_PG_URL: postgresql+asyncpg://postgres:kdz@127.0.0.1:5432/kdz
      KDZ_PG_DSN: postgresql://postgres:kdz@127.0.0.1:5432/kdz
      KDZ_PG_PORT: "8001"
      KDZ_API_BASE: http://127.0.0.1:8001
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # 初回は alembic_version が VARCHAR(32) で作られ 0008 で失敗する仕様（env.py が
      # 次回起動時に拡幅する）ため、2回流す。2回目で head に到達しなければ失敗。
      - name: Apply real migrations
        run: |
          python scripts/pg_alembic_upgrade.py upgrade head || echo "::notice::1回目の upgrade が失敗（新規 DB では 0008 で想定内）。2回目で head 到達を判定します"
          python scripts/pg_alembic_upgrade.py upgrade head

      - name: Start API on PostgreSQL (:8001)
        run: |
          nohup python scripts/run_pg_e2e.py > /tmp/pg_api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8001/health > /dev/null; then echo "api up"; exit 0; fi
            sleep 2
          done
          echo "API did not start"; cat /tmp/pg_api.log; exit 1

      - name: Run concurrency scenarios
        run: python scripts/pg_concurrency_check.py

      - name: API log (on failure)
        if: failure()
        run: cat /tmp/pg_api.log || true

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      # next build 用のダミー値。実際の値は Vercel の Environment Variables に設定済み。
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      AUTH_SECRET: ci-dummy-secret-not-for-production-use-only
      APP_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint (errors only fail; warnings allowed)
        run: npx eslint src

      - name: Build
        run: npx next build

  # 失敗 → 復旧を運営へ通知する。GitHub は失敗メールしか送らないため、LINE／メールへ
  # 「[FAILED]」と「[RECOVERED]」を同じ経路で届ける（正常時は通知しない）。
  # 直前の結論は GitHub API の実行履歴から引く（状態のキャッシュ不要）。実体は scripts/run_transition_notify.py。
  # concurrency の打ち切り（cancelled）は失敗にも復旧にも数えない。
  notify:
    needs: [backend, pg-concurrency, web]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Notify failure / recovery
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: ci.yml
          BRANCH: main
          LABEL: "CI（pytest / PG 同時実行 / tsc・eslint・next build）"
          RESULT: ${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          ALERT_EMAILS: ${{ secrets.ALERT_EMAILS }}
          ALERT_MAIL_FROM: ${{ secrets.ALERT_MAIL_FROM }}
          ALERT_LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.ALERT_LINE_CHANNEL_ACCESS_TOKEN }}
          ALERT_LINE_USER_IDS: ${{ secrets.ALERT_LINE_USER_IDS }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: python scripts/run_transition_notify.py
